[package]
name = "radar"
version = "0.2.0"
edition = "2024"
rust-version = "1.86"
license = "AGPL-3.0-only"
description = "Realistic radar and sensor simulation for games and simulations: scanning, probabilistic detection, measurement noise, tracking and electronic warfare."
authors = ["CryptoPatrick <cryptopatrick@gmail.com>"]
repository = "https://github.com/cryptopatrick/radar"
documentation = "https://docs.rs/radar"
readme = "README.md"
keywords = ["radar", "sensor", "simulation", "gamedev", "tracking"]
categories = ["simulation", "game-development", "science"]
include = ["/src", "/examples", "/tests", "/README.md", "/CHANGELOG.md", "/LICENSE", "/COPYING"]

[dependencies]
rand_core = "0.10"
rand_chacha = "0.10"
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
getrandom = { version = "0.4", optional = true }

[features]
default = ["tracking", "ew"]
tracking = []
ew = []
serde = ["dep:serde"]
entropy = ["dep:getrandom"]
diagnostics = []

[dev-dependencies]
proptest = "1"
approx = "0.5"
criterion = "0.8"

[[bench]]
name = "radar_2d"
harness = false

[[example]]
name = "basic_2d"
required-features = ["tracking"]

[[example]]
name = "passive_starlink"

[[example]]
name = "multi_sensor"
required-features = ["tracking"]
